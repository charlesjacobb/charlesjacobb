<svg xmlns="http://www.w3.org/2000/svg" width="548" height="456" viewBox="0 0 548 456"><title>charles jacob. whoami</title><style>@font-face{font-family:J;font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:J;font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}text{font-family:J,ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.l{animation:f .4s cubic-bezier(.22,1,.36,1) both}@keyframes f{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}@media (prefers-reduced-motion:reduce){.l{animation:none}}</style><rect width="548" height="456" fill="#0A0A0A"/><rect x=".5" y=".5" width="547" height="455" fill="none" stroke="#262626"/><text x="16" y="23" font-size="13" fill="#7A7572">charles@glarus ~ <tspan fill="#F03A1E">$</tspan><tspan fill="#D6D6D2"> whoami</tspan></text><line x1="0" y1="36.5" x2="548" y2="36.5" stroke="#262626"/><g class="l" style="animation-delay:0.50s"><text x="24" y="84" font-size="24" font-weight="700" fill="#FFFFFF">charles jacob.</text></g><g class="l" style="animation-delay:0.62s"><line x1="24" y1="104.5" x2="226" y2="104.5" stroke="#3A3A3A"/></g><g class="l" style="animation-delay:0.74s"><text x="24" y="142" font-size="14" font-weight="700" fill="#F03A1E">base</text><text x="112" y="142" font-size="14" fill="#D6D6D2">Glarus / Zürich, CH</text></g><g class="l" style="animation-delay:0.86s"><text x="24" y="172" font-size="14" font-weight="700" fill="#F03A1E">role</text><text x="112" y="172" font-size="14" fill="#D6D6D2">AI operator / marketeer / creative systems</text></g><g class="l" style="animation-delay:0.98s"><text x="24" y="202" font-size="14" font-weight="700" fill="#F03A1E">core</text><text x="112" y="202" font-size="14" fill="#D6D6D2">stdlib-first Python: asyncio, sqlite3, argparse</text></g><g class="l" style="animation-delay:1.10s"><text x="24" y="232" font-size="14" font-weight="700" fill="#F03A1E">orch</text><text x="112" y="232" font-size="14" fill="#D6D6D2">agent fan-out, planner/runner queues, launchd</text></g><g class="l" style="animation-delay:1.22s"><text x="24" y="262" font-size="14" font-weight="700" fill="#F03A1E">llm</text><text x="112" y="262" font-size="14" fill="#D6D6D2">local inference: MLX, Ollama, GGUF quants</text></g><g class="l" style="animation-delay:1.34s"><text x="24" y="292" font-size="14" font-weight="700" fill="#F03A1E">data</text><text x="112" y="292" font-size="14" fill="#D6D6D2">numpy + pandas, TA-Lib, vectorized backtests</text></g><g class="l" style="animation-delay:1.46s"><text x="24" y="322" font-size="14" font-weight="700" fill="#F03A1E">ig</text><text x="112" y="322" font-size="14" fill="#D6D6D2">@charlesjacob.ai</text></g><g class="l" style="animation-delay:1.58s"><text x="24" y="364" font-size="14" fill="#7A7572">Move smart. Stay free. Build anyway.</text></g><g class="l" style="animation-delay:1.70s"><rect x="24" y="396" width="36" height="18" fill="#2f2724"/><rect x="60" y="396" width="36" height="18" fill="#3e312c"/><rect x="96" y="396" width="36" height="18" fill="#553429"/><rect x="132" y="396" width="36" height="18" fill="#673d30"/><rect x="168" y="396" width="36" height="18" fill="#775446"/><rect x="204" y="396" width="36" height="18" fill="#b67661"/><rect x="240" y="396" width="36" height="18" fill="#e2b89d"/><rect x="276" y="396" width="36" height="18" fill="#fef4d6"/></g></svg>